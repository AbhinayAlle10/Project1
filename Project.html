<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B.Tech Student Portfolio</title>
  <link rel="stylesheet" href="Project.css" />
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <h1>Hello, I'm a B.Tech Student</h1>
  </header>

  <main>
    <section id="about">
      <h2>About Me</h2>
      <p>I am currently pursuing my B.Tech in Data Science.</p>
    </section>

    <section id="skills">
      <h2>My Skills</h2>
      <ul>
        <li>HTML & CSS</li>
        <li>JavaScript</li>
        <li>React Basics</li>
        <li>Git & GitHub</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact Me</h2>
      <form id="contactForm">
        <input type="text" id="name" placeholder="Enter your name" required />
        <input type="email" id="email" placeholder="Enter your email" required />
        <button type="submit">Submit</button>
      </form>
      <p id="formMsg"></p>
    </section>
  </main>

  <footer>
    <p>© 2025 Student Portfolio. All rights reserved.</p>
  </footer>

  <script src="Project.js"></script>
</body>
</html>
